<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cepresta - Solicitud de Crédito</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .mobile-card { background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 24px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #1e3a8a; font-size: 26px; font-weight: 700; }
    .header p { color: #64748b; font-size: 14px; margin-top: 4px; }
    
    /* Panel de Cálculo de Moto y Trámites */
    .moto-summary { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: #166534; font-weight: 600; }
    .summary-row input { width: 140px; padding: 6px; text-align: right; border: 1px solid #a7f3d0; border-radius: 6px; font-weight: 700; color: #15803d; }
    .summary-divider { border-top: 1px dashed #a7f3d0; margin: 8px 0; padding-top: 8px; }
    
    .alert-error { color: #dc2626; font-size: 11px; font-weight: 600; margin-top: 4px; display: none; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="number"], select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
    input:focus, select:focus { border-color: #2563eb; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Cédula (Frontal y Trasera) */
    .id-upload-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .upload-box { border: 2px dashed #94a3b8; border-radius: 10px; padding: 12px; text-align: center; background: #f8fafc; cursor: pointer; transition: 0.2s; }
    .upload-box:hover { border-color: #2563eb; background: #eff6ff; }
    .upload-box p { font-size: 11px; color: #64748b; margin-top: 4px; }
    .file-input { display: none; }
    .preview-img { max-width: 100%; max-height: 70px; border-radius: 6px; margin-top: 6px; display: none; }

    /* Sección Ingresos Familiares */
    .family-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-top: 16px; }
    .family-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .family-title { font-size: 13px; font-weight: 700; color: #1e293b; }

    .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div class="header">
      <h1>CEPRESTA</h1>
      <p>Solicitud de Crédito de Vehículo</p>
    </div>

    <!-- 1. Valor Moto, Trámites y Cuota Inicial Abierta (>= 20%) -->
    <div class="moto-summary">
      <div class="summary-row">
        <span>Valor Moto ($):</span>
        <input type="number" id="motoValue" value="8000000" oninput="calculateValidation()">
      </div>
      <div class="summary-row">
        <span>Trámites (SOAT/Matrícula):</span>
        <input type="number" id="feesValue" value="1200000" oninput="calculateValidation()">
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row">
        <span>Valor Inicial ($):</span>
        <input type="number" id="initialPayment" value="2000000" oninput="calculateValidation()">
      </div>
      <div id="minWarning" class="alert-error">
        ⚠️ La cuota inicial no puede ser menor al 20% del total ($<span id="minAmountLabel">0</span>).
      </div>
    </div>

    <form id="creditForm">
      <div class="form-group">
        <label for="fullname">Nombre y Apellidos *</label>
        <input type="text" id="fullname" placeholder="Ej. Carlos Mendoza" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="idNumber">Número de CC *</label>
          <input type="text" id="idNumber" placeholder="Ej. 1012345678" required>
        </div>
        <div class="form-group">
          <label for="phone">Celular (WhatsApp) *</label>
          <input type="tel" id="phone" placeholder="Ej. 300 000 0000" required>
        </div>
      </div>

      <!-- 2. Carga de Cédula (Dos Lados) -->
      <div class="form-group">
        <label>Foto de la Cédula (Ambos Lados) *</label>
        <div class="id-upload-container">
          <!-- Frontal -->
          <div class="upload-box" onclick="document.getElementById('idFront').click()">
            <span style="font-size: 18px;">📷</span>
            <p id="txtFront">Cédula Frontal</p>
            <img id="previewFront" class="preview-img" alt="Frontal">
          </div>
          <input type="file" id="idFront" class="file-input" accept="image/*" onchange="handleFileSelect(event, 'previewFront', 'txtFront')">

          <!-- Trasera -->
          <div class="upload-box" onclick="document.getElementById('idBack').click()">
            <span style="font-size: 18px;">📸</span>
            <p id="txtBack">Cédula Trasera</p>
            <img id="previewBack" class="preview-img" alt="Trasera">
          </div>
          <input type="file" id="idBack" class="file-input" accept="image/*" onchange="handleFileSelect(event, 'previewBack', 'txtBack')">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="income">Ingresos Mensuales *</label>
          <input type="number" id="income" placeholder="$ 2.500.000" required>
        </div>
        <div class="form-group">
          <label for="expenses">Egresos Mensuales *</label>
          <input type="number" id="expenses" placeholder="$ 1.000.000" required>
        </div>
      </div>

      <!-- 3. Sección Ingresos Familiares -->
      <div class="family-section">
        <div class="family-header">
          <span class="family-title">👨‍👩‍👧 Ingresos Familiares (Opcional)</span>
          <input type="checkbox" id="toggleFamily" onchange="toggleFamilyForm()">
        </div>

        <div id="familyFields" style="display: none;">
          <div class="grid-2">
            <div class="form-group">
              <label for="famRelation">Parentesco</label>
              <select id="famRelation">
                <option value="Esposa">Esposa/Esposo</option>
                <option value="Padre">Padre/Madre</option>
                <option value="Hijo">Hijo/Hija</option>
                <option value="Hermano">Hermano/Hermana</option>
              </select>
            </div>
            <div class="form-group">
              <label for="famCC">CC Familiar</label>
              <input type="text" id="famCC" placeholder="Ej. 1098765432">
            </div>
          </div>

          <div class="form-group">
            <label for="famName">Nombre Familiar</label>
            <input type="text" id="famName" placeholder="Nombre completo">
          </div>

          <div class="form-group">
            <label for="famActivity">Actividad Económica</label>
            <input type="text" id="famActivity" placeholder="Ej. Empleado / Comerciante">
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="famIncome">Ingresos</label>
              <input type="number" id="famIncome" placeholder="$ 0">
            </div>
            <div class="form-group">
              <label for="famExpenses">Egresos</label>
              <input type="number" id="famExpenses" placeholder="$ 0">
            </div>
          </div>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Validar número por WhatsApp ➔</button>
    </form>
  </div>

  <script>
    // Validar regla del 20% mínimo
    function calculateValidation() {
      const moto = parseFloat(document.getElementById('motoValue').value) || 0;
      const fees = parseFloat(document.getElementById('feesValue').value) || 0;
      const initial = parseFloat(document.getElementById('initialPayment').value) || 0;

      const totalSum = moto + fees;
      const minRequired = totalSum * 0.20;

      document.getElementById('minAmountLabel').innerText = minRequired.toLocaleString('es-CO');

      const warning = document.getElementById('minWarning');
      const btn = document.getElementById('btnSubmit');

      if (initial < minRequired) {
        warning.style.display = 'block';
        btn.disabled = true;
        btn.style.opacity = '0.5';
      } else {
        warning.style.display = 'none';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    // Previsualizar ambas fotos de la cédula
    function handleFileSelect(event, previewId, textId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById(previewId);
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.getElementById(textId).innerText = "Cargada ✓";
        }
        reader.readAsDataURL(file);
      }
    }

    // Alternar campos de Ingresos Familiares
    function toggleFamilyForm() {
      const isChecked = document.getElementById('toggleFamily').checked;
      document.getElementById('familyFields').style.display = isChecked ? 'block' : 'none';
    }

    document.getElementById('creditForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Solicitud enviada correctamente.');
    });

    calculateValidation();
  </script>
</body>
</html>
